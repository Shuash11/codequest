name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (Windows, .NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CodeQuest.sln

      - name: Build
        run: dotnet build CodeQuest.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CodeQuest.sln --no-build --configuration Release
