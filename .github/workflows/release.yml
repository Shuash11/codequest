name: Release

# Publishes a release when a version tag (v1.4.0, ...) is pushed. The
# installer asset is built here on GitHub's runner - never locally - and
# published to the PUBLIC distribution repository (Shuash11/codequest),
# which is what installed copies check for updates.
# Cross-repo publishing needs a personal access token in the repository
# secret RELEASE_TOKEN (repo + release write on Shuash11/codequest).
# Without it, the workflow still builds and uploads the installer as an
# artifact of THIS repository and prints the manual attach command.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CodeQuest.sln

      - name: Build
        run: dotnet build CodeQuest.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CodeQuest.sln --no-build --configuration Release

      - name: Publish (self-contained single-file .exe, symbols embedded)
        run: >
          dotnet publish src/CodeQuest/CodeQuest.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o publish

      - name: Write runtime config (AI provider key from repo secret)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'publish/config' | Out-Null
          @{
            aiProviders = @(
              @{ name = 'openrouter'; baseUrl = 'https://openrouter.ai/api/v1'; apiKey = $env:OPENROUTER_API_KEY; model = 'nvidia/nemotron-3-ultra-550b-a55b:free' }
            )
          } | ConvertTo-Json -Depth 5 | Set-Content 'publish/config/config.local.json'

      - name: Seed the demo database (schema + users + campaign)
        shell: pwsh
        run: >
          python -c "import sqlite3; con = sqlite3.connect('publish/codequest.db');
          con.executescript(open('database/schema.sql', encoding='utf-8').read());
          con.executescript(open('database/seed.sql', encoding='utf-8').read());
          con.executescript(open('database/campaign.sql', encoding='utf-8').read());
          con.commit(); con.close()"

      - name: Build the installer (Inno Setup, per-user)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path 'src/CodeQuest/CodeQuest.csproj' -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          Write-Output "installer version: $version"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem 'C:\Program Files (x86)' -Filter 'ISCC.exe' -Recurse | Select-Object -First 1).FullName }
          & $iscc /DAppVersion=$version installer/codequest.iss

      - name: Upload installer artifact (this repository)
        uses: actions/upload-artifact@v4
        with:
          name: CodeQuest-Setup
          path: installer/CodeQuest-Setup-*.exe
          if-no-files-found: error

      - name: Publish the release to Shuash11/codequest
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN)) {
            Write-Output "RELEASE_TOKEN is not configured: the installer was built and uploaded as this run's artifact."
            Write-Output "Attach it manually with: gh release create v<version> installer/CodeQuest-Setup-<version>.exe --repo Shuash11/codequest"
            exit 0
          }

          $version = (Select-String -Path 'src/CodeQuest/CodeQuest.csproj' -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $installer = Get-ChildItem 'installer' -Filter "CodeQuest-Setup-$version.exe" | Select-Object -First 1
          Copy-Item $installer.FullName 'CodeQuest-Setup.exe'
          $env:GH_TOKEN = $env:RELEASE_TOKEN
          gh release create "v$version" 'CodeQuest-Setup.exe' --repo Shuash11/codequest --title "CodeQuest $version" --notes "CodeQuest $version installer, built by GitHub Actions from tag v$version. See the repository README for what is new."
